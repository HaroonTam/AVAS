[detection]
weights = ../models/yolo11n.pt
confidence = 0.35
image_size = 640
device = auto

[depth]
model_dir = ../models/depth-anything-v2-small-hf
image_size = 518
device = auto

[fusion]
method = center_region_median
inner_fraction = 0.5
min_valid_pixels = 9
min_valid_fraction = 0.5
trim_fraction = 0.05
left_boundary = 0.3333333333333333
right_boundary = 0.6666666666666666
mirrored = false
; 离线示例按前向、未镜像图像解释；实际摄像头安装未确认时设为 unknown。
camera_orientation = forward

[risk]
; 仅用于研究原型和合成测试，尚未验证为实际行走阈值。
high_distance_m = 1.0
medium_distance_m = 2.0
min_confidence = 0.5
freshness_ms = 1000
cooldown_ms = 3000
obstacle_labels = person,chair,bicycle,car,bus,motorcycle
; 独立前向类别规则可在无距离时保留 MEDIUM；默认关闭，需实验依据。
independent_hazard_labels =

[camera]
index = 0
width = 640
height = 480
timeout_s = 3

[speech]
rate = 0
timeout_s = 15
