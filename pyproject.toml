[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-assistance"
version = "0.1.0"
description = "YOLO11 and Depth Anything V2 visual assistance research prototype"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
vision = ["ultralytics==8.4.37", "torch>=2.2,<3", "opencv-python>=4.8,<5"]
depth = ["transformers==5.6.2", "torch>=2.2,<3", "opencv-python>=4.8,<5"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "ANN"]
