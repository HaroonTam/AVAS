[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-assistance"
version = "0.1.0"
description = "YOLO11 and Depth Anything V2 visual assistance research prototype"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
vision = ["ultralytics==8.4.37", "torch>=2.2,<3", "opencv-python>=4.8,<5"]
depth = ["transformers==5.6.2", "torch>=2.2,<3", "opencv-python>=4.8,<5"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py310"
# 关闭按目录推断 first-party 的启发式：ultralytics 运行时会在仓库根生成 `Ultralytics/`
# 设置目录，会被误判成本地包，使导入分组随本机运行痕迹变化（同一提交在不同工作区结果不同）。
src = []

[tool.ruff.lint]
select = ["E", "F", "I", "ANN"]

[tool.ruff.lint.isort]
# 显式声明本项目自身的包，替代上面的目录推断。
known-first-party = ["app", "tests"]
